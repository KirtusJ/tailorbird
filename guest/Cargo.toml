[package]
name = "tailorbird-guest"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Native PCP OS Tailorbird UI prototype; no model or tool backend"

[features]
live-work-demo = []
# A stand-in for a model service, for checking the channel. Not a model; on no release image.
talk-test-worker = []
# Opt-in inference qualification worker; never enabled by the ordinary UI build.
model-worker = ["dep:pcpos-qwen", "dep:pcpos-gguf", "dep:pcpos-model-media"]
sse2-qualification = ["model-worker", "dep:pcpos-model-tensor"]

[lib]
name = "tailorbird_ui"
path = "src/lib.rs"

[[bin]]
name = "tailorbird"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "tailorbird-work-demo"
path = "src/work_demo_main.rs"
test = false
bench = false
required-features = ["live-work-demo"]

[[bin]]
name = "talk-test-worker"
path = "src/talk_test_worker_main.rs"
test = false
bench = false
required-features = ["talk-test-worker"]

[[bin]]
name = "model-worker"
path = "src/model_worker_main.rs"
test = false
bench = false
required-features = ["model-worker"]

[[example]]
name = "model_prompt"
required-features = ["model-worker"]

[[example]]
name = "model_chat"
required-features = ["model-worker"]

[[example]]
name = "sse2_forward"
required-features = ["sse2-qualification"]

[dependencies]
pcpos-model-tensor = { path = "../pcp-os/PCP_OS_Rust/crates/pcpos-model-tensor", optional = true }
pcpos-qwen = { path = "../pcp-os/PCP_OS_Rust/crates/pcpos-qwen", optional = true }
pcpos-gguf = { path = "../pcp-os/PCP_OS_Rust/crates/pcpos-gguf", optional = true }
pcpos-model-media = { path = "../pcp-os/PCP_OS_Rust/crates/pcpos-model-media", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
pcp-game-guest = { path = "../pcp-os/store/native/guest" }
