# Pass this configuration only when linking a freestanding PCP OS guest.
[target.x86_64-unknown-linux-gnu]
linker = "ld"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "code-model=large",
  "-C", "no-redzone=yes",
  "-C", "link-arg=-Tpcp-os/store/games/flux-rink/guest.ld",
  "-C", "link-arg=--build-id=none",
  "-C", "link-arg=-z",
  "-C", "link-arg=max-page-size=4096",
  "-C", "link-arg=-static",
  "-C", "link-arg=-nostdlib",
]
