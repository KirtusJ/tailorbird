name: Catalogue
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The catalogue is the tree, inline relative links hold, no session context
        run: python3 guest/tests/check_catalog.py
