name: Model worker SSE2 qualification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NIGHTLY: nightly-2026-05-01
      PCP_MODEL_MANIFEST_SHA256: bbdaa8cd263d9454159f12b55ec32613d18a4b7b4d75d284ad0cadc932bc1f4b
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
      - name: Install pinned compilers and emulator
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld qemu-system-x86
      - name: Export and check the two decoder fixtures
        run: |
          export QWEN_FIXTURE_DIR="$RUNNER_TEMP/fixtures"
          mkdir "$QWEN_FIXTURE_DIR"
          echo "QWEN_FIXTURE_DIR=$QWEN_FIXTURE_DIR" >> "$GITHUB_ENV"
          cargo +1.97.0 test --locked --manifest-path pcp-os/PCP_OS_Rust/Cargo.toml \
            -p pcpos-qwen --test forward export_reference_models -- --ignored --exact
          for arch in qwen2 qwen3; do
            digest=$(head -1 "pcp-os/PCP_OS_Rust/crates/pcpos-qwen/tests/data/$arch-forward.txt")
            echo "$digest  $QWEN_FIXTURE_DIR/$arch.gguf" | sha256sum -c
          done
      - name: Build the actual worker and both decoder probes
        shell: bash
        run: |
          set -eu
          mkdir qualification
          rustc +"$NIGHTLY" -vV | tee qualification/compiler.txt
          git rev-parse HEAD > qualification/source.txt
          git submodule status >> qualification/source.txt
          cargo +"$NIGHTLY" build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec --locked --release \
            --target guest/targets/x86_64-pcpos-worker.json --features model-worker --bin model-worker
          cp target/x86_64-pcpos-worker/release/model-worker qualification/
          objdump -d qualification/model-worker > "$RUNNER_TEMP/worker.s"
          grep -m1 -E '[[:space:]]mulsd[[:space:]]' "$RUNNER_TEMP/worker.s" | tee qualification/codegen.txt
          grep -m1 -E '[[:space:]]addsd[[:space:]]' "$RUNNER_TEMP/worker.s" | tee -a qualification/codegen.txt
          test -z "$(nm -u qualification/model-worker)"
          for spec in guest/targets/x86_64-pcpos-worker.json x86_64-unknown-none; do
            name=$(basename "$spec" .json)
            cargo +"$NIGHTLY" build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec --locked --release \
              --target "$spec" --features sse2-qualification --example sse2_forward
            cp "target/$name/release/examples/sse2_forward" "qualification/$name"
          done
          sha256sum qualification/model-worker qualification/x86_64-* | tee qualification/binaries.sha256
      - name: Run both numerical probes in the same PCP OS kernel
        run: |
          RUSTUP_TOOLCHAIN=1.97.0 sh pcp-os/PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          cp pcp-os/PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 "$RUNNER_TEMP/kernel.elf32"
          cd qualification
          sha256sum "$RUNNER_TEMP/kernel.elf32" > kernel.sha256
          for name in x86_64-unknown-none x86_64-pcpos-worker; do
            cp "$name" qwen-probe
            status=0
            timeout 180 qemu-system-x86_64 -machine pc -accel tcg -cpu qemu64 -m 256M \
              -kernel "$RUNNER_TEMP/kernel.elf32" -initrd qwen-probe -append 'auto=qwen-probe then=off' \
              -display none -nic none -serial "file:$name.log" -no-reboot \
              -device isa-debug-exit,iobase=0xf4,iosize=0x04 || status=$?
            cat "$name.log"
            test "$status" = 33
            grep -Fq 'Qwen decoder passed 128 reference logits' "$name.log"
            grep -Fq 'ALL SELF-TESTS PASS' "$name.log"
          done
      - name: Retain worker, probes and boot records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sse2-worker-qualification
          path: qualification/
          retention-days: 14
