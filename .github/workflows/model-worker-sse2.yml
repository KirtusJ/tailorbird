name: Model worker SSE2 qualification
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NIGHTLY: nightly-2026-05-01
      PCP_MODEL_MANIFEST_SHA256: bbdaa8cd263d9454159f12b55ec32613d18a4b7b4d75d284ad0cadc932bc1f4b
      QWEN3_8B_MANIFEST: 2c02ff6f00a2ee802ce09648dfbc56dda38a64b009635f0aeb383f09e1af67dc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
      - name: Install pinned compilers and emulator
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld qemu-system-x86
      - name: Export and check the two decoder fixtures
        run: |
          cargo +1.97.0 test --locked --release --lib --features model-worker
          export QWEN_FIXTURE_DIR="$RUNNER_TEMP/fixtures"
          mkdir "$QWEN_FIXTURE_DIR"
          echo "QWEN_FIXTURE_DIR=$QWEN_FIXTURE_DIR" >> "$GITHUB_ENV"
          cargo +1.97.0 test --locked --manifest-path pcp-os/PCP_OS_Rust/Cargo.toml \
            -p pcpos-qwen --test forward export_reference_models -- --ignored --exact
          for arch in qwen2 qwen3; do
            digest=$(head -1 "pcp-os/PCP_OS_Rust/crates/pcpos-qwen/tests/data/$arch-forward.txt")
            echo "$digest  $QWEN_FIXTURE_DIR/$arch.gguf" | sha256sum -c
          done
      - name: Build the actual worker and both decoder probes
        shell: bash
        run: |
          set -eu
          mkdir qualification
          rustc +"$NIGHTLY" -vV | tee qualification/compiler.txt
          git rev-parse HEAD > qualification/source.txt
          git submodule status >> qualification/source.txt
          build_worker() {
            local output=$1 pin=$2
            PCP_MODEL_MANIFEST_SHA256="$pin" cargo +"$NIGHTLY" build -Zbuild-std=core,alloc \
              -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec --locked --release \
              --target guest/targets/x86_64-pcpos-worker.json --features model-worker --bin model-worker
            cp target/x86_64-pcpos-worker/release/model-worker "qualification/$output"
            test -z "$(nm -u "qualification/$output")"
            printf '%s  %s\n' "$pin" "$output" >> qualification/model-manifests.txt
          }
          build_worker model-worker "$PCP_MODEL_MANIFEST_SHA256"
          build_worker model-worker-qwen3-8b "$QWEN3_8B_MANIFEST"
          if cmp -s qualification/model-worker qualification/model-worker-qwen3-8b; then
            echo 'Workers for different model manifests must have different bytes' >&2
            exit 1
          fi
          objdump -d qualification/model-worker > "$RUNNER_TEMP/worker.s"
          grep -m1 -E '[[:space:]]mulsd[[:space:]]' "$RUNNER_TEMP/worker.s" | tee qualification/codegen.txt
          grep -m1 -E '[[:space:]]addsd[[:space:]]' "$RUNNER_TEMP/worker.s" | tee -a qualification/codegen.txt
          for op in vpmovzxbd vmulps vmulpd vpmaddubsw vpmaddwd; do
            grep -m1 -E "[[:space:]]${op}[[:space:]].*%ymm" "$RUNNER_TEMP/worker.s" | tee -a qualification/codegen.txt
            grep -qE "[[:space:]]${op}[[:space:]].*%ymm" "$RUNNER_TEMP/worker.s"
          done
          for spec in guest/targets/x86_64-pcpos-worker.json x86_64-unknown-none; do
            name=$(basename "$spec" .json)
            cargo +"$NIGHTLY" build -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec --locked --release \
              --target "$spec" --features sse2-qualification --example sse2_forward
            cp "target/$name/release/examples/sse2_forward" "qualification/$name"
          done
          (cd qualification && sha256sum model-worker model-worker-qwen3-8b x86_64-*) | tee qualification/binaries.sha256
      - name: Run both numerical probes in the same PCP OS kernel
        run: |
          RUSTUP_TOOLCHAIN=1.97.0 sh pcp-os/PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          cp pcp-os/PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 "$RUNNER_TEMP/kernel.elf32"
          cd qualification
          sha256sum "$RUNNER_TEMP/kernel.elf32" > kernel.sha256
          for trial in 1 2 3 4 5; do
            case "$trial" in
              1) cpu=qemu64 ;;
              2) cpu=max,-avx2 ;;
              3) cpu=max ;;
              4) cpu=max,-fma ;;
              5) cpu=max,-f16c ;;
            esac
            order=(x86_64-unknown-none x86_64-pcpos-worker)
            if [[ "$trial" == 2 ]]; then order=(x86_64-pcpos-worker x86_64-unknown-none); fi
            for name in "${order[@]}"; do
              backend=scalar
              packed=scalar
              if [[ "$name" == x86_64-pcpos-worker && "$trial" -ge 3 ]]; then
                backend=AVX2
                packed=AVX2
                if [[ "$cpu" == max ]]; then packed="AVX2 Q8_K"; fi
              fi
              cp "$name" qwen-probe
              status=0
              timeout 180 qemu-system-x86_64 -machine pc -accel tcg -cpu "$cpu" -m 256M \
                -kernel "$RUNNER_TEMP/kernel.elf32" -initrd qwen-probe -append 'auto=qwen-probe then=off' \
                -display none -nic none -serial "file:$name-$trial.log" -no-reboot \
                -device isa-debug-exit,iobase=0xf4,iosize=0x04 || status=$?
              cat "$name-$trial.log"
              test "$status" = 33
              grep -Fq "Qwen Q4_K/Q6_K projections passed with $backend" "$name-$trial.log"
              test "$(tr -d '\r' < "$name-$trial.log" | grep -Fxc "Qwen inference backend: $packed")" = 2
              if [[ "$packed" == "AVX2 Q8_K" ]]; then
                grep -Fq 'Qwen upstream Q8_K dots, four prompt positions, Stop and retry passed' "$name-$trial.log"
              fi
              grep -Fq 'Qwen decoder passed 128 reference logits' "$name-$trial.log"
              test "$(grep -Fc 'Qwen worker prefill progress passed opt-in, Stop and retry' "$name-$trial.log")" = 2
              grep -Fq 'ALL SELF-TESTS PASS' "$name-$trial.log"
            done
          done
          rm qwen-probe
      - name: Retain worker, probes and boot records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sse2-worker-qualification
          path: qualification/
          retention-days: 14

  reading-display:
    name: Native reading display and Stop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
      - name: Install compiler and emulator
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rust-src --target x86_64-unknown-none
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lld qemu-system-x86
      - name: Boot the guest with its test worker and compare the full display
        env:
          PCPOS_KERNEL_FEATURES: companion
          PCPOS_KERNEL_STAGE: ${{ runner.temp }}/reading-kernel
        run: |
          sh pcp-os/PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          sh build.sh --bin tailorbird
          sh build.sh --features talk-test-worker --bin talk-test-worker
          elf=target/x86_64-unknown-none/release
          mkdir reading-evidence
          kernel=pcp-os/PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32
          { git rev-parse HEAD; git submodule status; sha256sum "$kernel" "$elf/tailorbird" "$elf/talk-test-worker"; } > reading-evidence/source.txt
          python3 guest/tests/reading_native.py "$kernel" "$elf/tailorbird" "$elf/talk-test-worker" reading-evidence/guest
      - name: Retain original full guest frames and serial
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reading-display
          path: |
            reading-evidence/source.txt
            reading-evidence/guest/*.ppm
            reading-evidence/guest/serial.log
            reading-evidence/guest/drawn-*/steps.txt
          retention-days: 14
