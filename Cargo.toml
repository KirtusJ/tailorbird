# One workspace at the top, so that Cargo names the pcp-os guest library by its place in this repository
# and the built program is the same wherever the repository is checked out.
[workspace]
resolver = "2"
members = ["guest"]
# These path dependencies inherit metadata from PCP OS's own nested workspace.
exclude = ["pcp-os/PCP_OS_Rust", "pcp-os/PCP_OS_Rust/crates/*"]

[profile.release]
panic = "abort"
opt-level = "s"
lto = "off" # matches PT's successful CARGO_PROFILE_RELEASE_LTO=off link
codegen-units = 1
overflow-checks = true

# Numerical kernels are built for throughput; the UI retains its size profile.
[profile.release.package.pcpos-qwen]
opt-level = 3
[profile.release.package.pcpos-model-tensor]
opt-level = 3
[profile.release.package.pcpos-model-simd]
opt-level = 3
